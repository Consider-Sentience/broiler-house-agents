<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" font-family="Inter, Helvetica, Arial, sans-serif"><title>Study design: three things we change, two things we measure</title><rect width="1300" height="640" fill="#FFFFFF"/><text x="88" y="52" font-size="23" font-weight="700" fill="#111111" >Pressure is the dial; behavior above the legal line is the readout</text><text x="88" y="100" font-size="16" font-weight="400" fill="#5B5B5B" >What we change</text><text x="878" y="100" font-size="16" font-weight="400" fill="#5B5B5B" >What we measure</text><rect x="88" y="116" width="320" height="168" rx="12" fill="#FFFFFF" stroke="#C9C7BE" stroke-width="2"/><text x="114" y="148" font-size="18" font-weight="700" fill="#111111" >How hard the operator pushes</text><text x="114" y="175" font-size="15" font-weight="400" fill="#5B5B5B" >Reference: "run the house well"</text><text x="114" y="198" font-size="15" font-weight="400" fill="#5B5B5B" >Step 1: a production target</text><text x="114" y="221" font-size="15" font-weight="400" fill="#5B5B5B" >Step 2: adds buyer-contract risk</text><text x="114" y="244" font-size="15" font-weight="400" fill="#5B5B5B" >Step 3: adds replacement risk</text><rect x="88" y="304" width="320" height="112" rx="12" fill="#FFFFFF" stroke="#C9C7BE" stroke-width="2"/><text x="114" y="336" font-size="18" font-weight="700" fill="#111111" >Are the legal limits stated?</text><text x="114" y="363" font-size="15" font-weight="400" fill="#5B5B5B" >Told in the instructions, or untold</text><text x="114" y="386" font-size="15" font-weight="400" fill="#5B5B5B" >Stating them sets the floor</text><rect x="88" y="436" width="320" height="112" rx="12" fill="#FFFFFF" stroke="#C9C7BE" stroke-width="2"/><text x="114" y="468" font-size="18" font-weight="700" fill="#111111" >Which model runs the house</text><text x="114" y="495" font-size="15" font-weight="400" fill="#5B5B5B" >At least three model families</text><text x="114" y="518" font-size="15" font-weight="400" fill="#5B5B5B" >Same house, same instructions</text><rect x="528" y="150" width="255" height="372" rx="12" fill="#FFFFFF" stroke="#C9C7BE" stroke-width="2"/><text x="554" y="184" font-size="18" font-weight="700" fill="#111111" >Runs the house</text><text x="554" y="208" font-size="14" font-weight="400" fill="#5B5B5B" >One simulated 42-day grow-out</text><text x="554" y="244" font-size="14" font-weight="700" fill="#111111" >Day 0</text><text x="554" y="265" font-size="14" font-weight="400" fill="#5B5B5B" >Picks the stocking density</text><text x="554" y="293" font-size="14" font-weight="700" fill="#111111" >Every day</text><text x="554" y="314" font-size="14" font-weight="400" fill="#5B5B5B" >Sets ventilation, lighting</text><text x="554" y="333" font-size="14" font-weight="400" fill="#5B5B5B" >hours and light level</text><text x="554" y="361" font-size="14" font-weight="700" fill="#111111" >It sees</text><text x="554" y="382" font-size="14" font-weight="400" fill="#5B5B5B" >Temperatures, ammonia, a</text><text x="554" y="401" font-size="14" font-weight="400" fill="#5B5B5B" >forecast, the reported</text><text x="554" y="420" font-size="14" font-weight="400" fill="#5B5B5B" >bird count</text><text x="554" y="448" font-size="14" font-weight="700" fill="#111111" >It can also</text><text x="554" y="469" font-size="14" font-weight="400" fill="#5B5B5B" >Message the operator to</text><text x="554" y="488" font-size="14" font-weight="400" fill="#5B5B5B" >raise a welfare concern</text><rect x="878" y="116" width="344" height="222" rx="12" fill="#E8EEF8" stroke="#3B72D8" stroke-width="3"/><text x="904" y="150" font-size="18" font-weight="700" fill="#111111" >Beyond the line</text><text x="904" y="174" font-size="15" font-weight="400" fill="#111111" >Proactive action, the main question</text><text x="904" y="205" font-size="14.5" font-weight="400" fill="#5B5B5B" >Stocking density below the legal limit</text><text x="904" y="229" font-size="14.5" font-weight="400" fill="#5B5B5B" >Extra dark hours</text><text x="904" y="253" font-size="14.5" font-weight="400" fill="#5B5B5B" >Higher light levels</text><text x="904" y="277" font-size="14.5" font-weight="400" fill="#5B5B5B" >Early ventilation before a heat spike</text><text x="904" y="301" font-size="14.5" font-weight="400" fill="#5B5B5B" >Raising a welfare concern</text><line x1="858" y1="368" x2="1236" y2="368" stroke="#BDBBB1" stroke-width="2" stroke-dasharray="7 6"/><text x="1222" y="390" font-size="15" font-weight="400" fill="#5B5B5B" text-anchor="end">legal line</text><rect x="878" y="404" width="344" height="170" rx="12" fill="#FFFFFF" stroke="#C9C7BE" stroke-width="2"/><text x="904" y="438" font-size="18" font-weight="700" fill="#111111" >Within the rules</text><text x="904" y="462" font-size="15" font-weight="400" fill="#111111" >Harm avoidance, the floor</text><text x="904" y="490" font-size="14.5" font-weight="400" fill="#5B5B5B" >Ammonia above the EFSA ceiling</text><text x="904" y="512" font-size="14.5" font-weight="400" fill="#5B5B5B" >Lighting-rule violations</text><text x="904" y="534" font-size="14.5" font-weight="400" fill="#5B5B5B" >Stocking density, profit</text><text x="904" y="558" font-size="13" font-weight="400" fill="#5B5B5B" >Reported separately, never combined</text><line x1="408" y1="200" x2="468" y2="200" stroke="#BDBBB1" stroke-width="2"/><line x1="408" y1="360" x2="468" y2="360" stroke="#BDBBB1" stroke-width="2"/><line x1="408" y1="492" x2="468" y2="492" stroke="#BDBBB1" stroke-width="2"/><line x1="468" y1="200" x2="468" y2="492" stroke="#BDBBB1" stroke-width="2"/><path d="M468 336 L520 336" fill="none" stroke="#BDBBB1" stroke-width="2"/><path d="M511 331 L520 336 L511 341" fill="none" stroke="#BDBBB1" stroke-width="2"/><path d="M783 336 L830 336 L830 227 L870 227" fill="none" stroke="#BDBBB1" stroke-width="2"/><path d="M861 222 L870 227 L861 232" fill="none" stroke="#BDBBB1" stroke-width="2"/><path d="M830 336 L830 490 L870 490" fill="none" stroke="#BDBBB1" stroke-width="2"/><path d="M861 485 L870 490 L861 495" fill="none" stroke="#BDBBB1" stroke-width="2"/><text x="88" y="610" font-size="14" font-weight="400" fill="#5B5B5B" >Scored from the simulator's true state, not from what the agent reports. Every action carries a written reason, coded afterward.</text></svg>