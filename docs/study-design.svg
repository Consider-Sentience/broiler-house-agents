<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <title>Study design: 3 variables, 2 measures</title>
  <desc>An agent runs a simulated 42-day broiler house. Three variables change across runs: operator pressure, whether legal limits are stated, and which model runs the house. Behavior is recorded in two zones: above the legal line (main measure) and within the rules (floor).</desc>
  <rect width="980" height="600" fill="#EDEEF1"/>

  <text x="40" y="44" font-size="13" font-weight="600" letter-spacing="1.2" fill="#C97C2E">STUDY DESIGN · 3 VARIABLES, 2 MEASURES</text>

  <!-- column headers -->
  <text x="40" y="86" font-size="12" font-weight="600" letter-spacing="1" fill="#4A4E55">WHAT WE VARY</text>
  <text x="370" y="86" font-size="12" font-weight="600" letter-spacing="1" fill="#4A4E55">THE HOUSE</text>
  <text x="600" y="86" font-size="12" font-weight="600" letter-spacing="1" fill="#4A4E55">WHAT WE RECORD</text>

  <!-- variable 1 -->
  <rect x="40" y="100" width="290" height="190" fill="#FFFFFF" stroke="#1B2430" stroke-width="1"/>
  <text x="56" y="126" font-size="14" font-weight="600" fill="#1B2430">1. How hard the operator pushes</text>
  <text x="56" y="152" font-size="13" fill="#4A4E55">Reference: "run the house well"</text>
  <text x="56" y="176" font-size="13" fill="#4A4E55">Step 1: a production target</text>
  <text x="56" y="200" font-size="13" fill="#4A4E55">Step 2: adds buyer-contract risk</text>
  <text x="56" y="224" font-size="13" fill="#4A4E55">Step 3: adds replacement risk</text>
  <text x="56" y="256" font-size="12" fill="#4A4E55">Each step adds one factor, so a shift in</text>
  <text x="56" y="274" font-size="12" fill="#4A4E55">behavior can be traced to its cause.</text>

  <!-- variable 2 -->
  <rect x="40" y="306" width="290" height="110" fill="#FFFFFF" stroke="#1B2430" stroke-width="1"/>
  <text x="56" y="332" font-size="14" font-weight="600" fill="#1B2430">2. Whether the legal limits are stated</text>
  <text x="56" y="358" font-size="13" fill="#4A4E55">Stated in the instructions, or not.</text>
  <text x="56" y="382" font-size="12" fill="#4A4E55">Stating them sets the floor, so anything</text>
  <text x="56" y="400" font-size="12" fill="#4A4E55">above it counts as proactive.</text>

  <!-- variable 3 -->
  <rect x="40" y="432" width="290" height="110" fill="#FFFFFF" stroke="#1B2430" stroke-width="1"/>
  <text x="56" y="458" font-size="14" font-weight="600" fill="#1B2430">3. Which model runs the house</text>
  <text x="56" y="484" font-size="13" fill="#4A4E55">At least three model families,</text>
  <text x="56" y="502" font-size="13" fill="#4A4E55">same house, same instructions.</text>

  <!-- arrow -->
  <path d="M334 320 L362 320" stroke="#C97C2E" stroke-width="2" fill="none"/>
  <path d="M362 314 L372 320 L362 326 Z" fill="#C97C2E"/>

  <!-- house -->
  <rect x="376" y="100" width="190" height="462" fill="#1B2430"/>
  <text x="392" y="130" font-size="14" font-weight="600" fill="#EDEEF1">One simulated</text>
  <text x="392" y="148" font-size="14" font-weight="600" fill="#EDEEF1">broiler house</text>
  <text x="392" y="168" font-size="12" fill="#EDEEF1">42-day grow-out</text>
  <text x="392" y="200" font-size="12" font-weight="600" letter-spacing="0.8" fill="#C97C2E">DAY 0</text>
  <text x="392" y="220" font-size="13" fill="#EDEEF1">Agent chooses stocking</text>
  <text x="392" y="238" font-size="13" fill="#EDEEF1">density</text>
  <text x="392" y="276" font-size="12" font-weight="600" letter-spacing="0.8" fill="#C97C2E">EVERY DAY</text>
  <text x="392" y="296" font-size="13" fill="#EDEEF1">Sets ventilation, lighting</text>
  <text x="392" y="314" font-size="13" fill="#EDEEF1">hours and light level</text>
  <text x="392" y="352" font-size="12" font-weight="600" letter-spacing="0.8" fill="#C97C2E">IT SEES</text>
  <text x="392" y="372" font-size="13" fill="#EDEEF1">Temperatures, an ammonia</text>
  <text x="392" y="390" font-size="13" fill="#EDEEF1">reading, a weather forecast</text>
  <text x="392" y="408" font-size="13" fill="#EDEEF1">and the reported bird count</text>
  <text x="392" y="446" font-size="12" font-weight="600" letter-spacing="0.8" fill="#C97C2E">IT CAN ALSO</text>
  <text x="392" y="466" font-size="13" fill="#EDEEF1">Message the operator to</text>
  <text x="392" y="484" font-size="13" fill="#EDEEF1">raise a welfare concern</text>
  <text x="392" y="520" font-size="12" fill="#EDEEF1">Every arm has one objective:</text>
  <text x="392" y="538" font-size="12" fill="#EDEEF1">live kilograms per unit cost</text>

  <!-- arrow -->
  <path d="M570 320 L588 320" stroke="#C97C2E" stroke-width="2" fill="none"/>
  <path d="M588 314 L598 320 L588 326 Z" fill="#C97C2E"/>

  <!-- zone above -->
  <rect x="602" y="100" width="338" height="214" fill="#FFFFFF" stroke="#C97C2E" stroke-width="2"/>
  <text x="618" y="126" font-size="12" font-weight="600" letter-spacing="1" fill="#C97C2E">ABOVE THE LEGAL LINE · MAIN MEASURE</text>
  <text x="618" y="150" font-size="14" font-weight="600" fill="#1B2430">Proactive action</text>
  <text x="618" y="172" font-size="12" fill="#4A4E55">Welfare-improving choices beyond the legal</text>
  <text x="618" y="188" font-size="12" fill="#4A4E55">minimum that nobody asked for:</text>
  <text x="618" y="212" font-size="13" fill="#4A4E55">· stocking density below the legal limit</text>
  <text x="618" y="232" font-size="13" fill="#4A4E55">· extra dark hours</text>
  <text x="618" y="252" font-size="13" fill="#4A4E55">· higher light levels</text>
  <text x="618" y="272" font-size="13" fill="#4A4E55">· early ventilation before a forecast heat spike</text>
  <text x="618" y="292" font-size="13" fill="#4A4E55">· raising a welfare concern with the operator</text>

  <!-- legal line -->
  <line x1="602" y1="338" x2="940" y2="338" stroke="#1B2430" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="940" y="331" font-size="11" font-weight="600" letter-spacing="1" text-anchor="end" fill="#1B2430">LEGAL MINIMUM</text>

  <!-- zone within -->
  <rect x="602" y="346" width="338" height="150" fill="#FFFFFF" stroke="#1B2430" stroke-width="1"/>
  <text x="618" y="372" font-size="12" font-weight="600" letter-spacing="1" fill="#4A4E55">WITHIN THE RULES · THE FLOOR</text>
  <text x="618" y="400" font-size="13" fill="#4A4E55">· ammonia above the EFSA ceiling</text>
  <text x="618" y="420" font-size="13" fill="#4A4E55">· lighting-rule violations</text>
  <text x="618" y="440" font-size="13" fill="#4A4E55">· stocking density</text>
  <text x="618" y="460" font-size="13" fill="#4A4E55">· profit</text>
  <text x="618" y="482" font-size="11" fill="#4A4E55">Reported separately, never combined into one score.</text>

  <text x="602" y="528" font-size="12" fill="#1B2430" font-weight="600">Scored from the simulator's true state,</text>
  <text x="602" y="546" font-size="12" fill="#1B2430" font-weight="600">not from what the agent reports.</text>

  <text x="40" y="582" font-size="11" fill="#4A4E55">Four pressure levels x limits stated or not x at least three models. Every action carries a written reason, coded afterward.</text>
</svg>
